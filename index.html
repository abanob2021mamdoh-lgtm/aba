.big small,.st small{color:var(--mu);display:block;font-size:13px}.big b{font-size:30px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px}.st b{font-size:17px}
.pos{color:var(--ac)}.neg{color:var(--rd)}.wr{color:var(--am)}

.it .l{flex:1;min-width:0}.it .l b{display:block;font-weight:600;overflow-wrap:anywhere}.it small{color:var(--mu);font-size:13px}
.it .r{text-align:left;white-space:nowrap}
.it button{width:auto;min-height:36px;padding:4px 12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav>button.t{background:none;color:var(--mu);width:auto;flex:1;min-height:48px;font-weight:normal;font-size:14px}.nav>button.t.on{color:var(--ac);font-weight:bold}
.nav>button.f{width:62px;height:62px;border-radius:50%;font-size:34px;line-height:1;padding:0;margin-top:-26px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
#sh{background:var(--card);width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}

textarea{min-height:90px}.hide{display:none}.hd{display:flex;gap:8px}.hd>*{flex:1}

</head>

function act(){op('<h3>تسجيل حركة</h3><div class="ac2"><button onclick="saleSheet()">🛒<br>بيع من المخزون</button><button onclick="form(\'fix\')">🔧<br>صيانة</button><button onclick="form(\'vf\')">📲<br>فودافون كاش</button><button onclick="form(\'exp\')">💸<br>مصروف</button></div><button class="g" style="margin-top:12px" onclick="cl()">إغلاق</button>')}

/* البيع من المخزون */
function saleSheet(){cart=[];op('<h3>بيع من المخزون</h3><input id="q" placeholder="ابحث باسم الصنف..." oninput="sr()"><div id="ct"></div><div id="rs"></div>');sr();rc()}
function sr(){
  var t=norm($('q').value).split(/\s+/).filter(Boolean),r=[];
  if(!t.length){$('rs').innerHTML='<p style="color:var(--mu)">اكتب جزء من اسم الصنف.</p>';return}
  for(var i=0;i<P.length&&r.length<30;i++){var ok=true;for(var j=0;j<t.length;j++){if(P[i].k.indexOf(t[j])<0){ok=false;break}}if(ok)r.push(P[i])}
  $('rs').innerHTML=r.length?r.map(function(x){return '<div class="it" onclick="ac(\''+x.i+'\')"><div class="l"><b>'+esc(x.n)+'</b><small class="'+(x.q<=0?'neg':'')+'">المتاح: '+f(x.q)+'</small></div><div class="r"><b>'+f(x.p)+'</b></div></div>'}).join(''):'<p style="color:var(--mu)">لا يوجد صنف بهذا الاسم.</p>';
}
function ac(id){var l=cart.filter(function(c){return c.i===id})[0];if(l)l.q++;else cart.push({i:id,q:1,pr:M[id].p});rc()}
function cq(k,d){cart[k].q+=d;if(cart[k].q<1)cart.splice(k,1);rc()}
function cp(k,v){cart[k].pr=parseFloat(v)||0;rc()}
function rc(){
  if(!cart.length){$('ct').innerHTML='';return}
  var tot=0;
  var h=cart.map(function(c,k){var x=M[c.i];tot+=c.pr*c.q;
    return '<div class="it"><div class="l"><b>'+esc(x.n)+'</b>'+(x.q<c.q?'<small class="wr">المخزون أقل من الكمية</small>':'')+'</div><div class="q"><button class="g" onclick="cq('+k+',-1)">−</button><span>'+c.q+'</span><button class="g" onclick="cq('+k+',1)">+</button></div><input type="number" inputmode="decimal" style="width:80px" value="'+c.pr+'" onchange="cp('+k+',this.value)"></div>'}).join('');
  $('ct').innerHTML='<div style="margin:10px 0">'+h+'<button onclick="ss()">تسجيل البيع · '+f(tot)+' ج</button></div>';
}
function ss(){
  var d=$('dt').value||today(),b=Date.now();
  cart.forEach(function(c,k){var x=M[c.i];
    D.push({id:b+k,d:d,c:x.s,t:x.n+(c.q>1?' × '+c.q:''),a:c.pr*c.q,p:(c.pr-x.c)*c.q,pid:x.i,q:c.q});x.q-=c.q});
  saveP();saveD();cl();rh();
}

/* صيانة / فودافون / مصروف */
function form(c){
  var h='<h3>'+N[c]+'</h3><label>البيان</label><input id="t" placeholder="'+(c==='fix'?'مثال: تغيير شاشة':c==='vf'?'اسم العميل أو رقمه':'مثال: كهرباء')+'">';
  if(c==='vf')h+='<label>العملية</label><select id="v"><option value="in">إيداع (العميل دفع لي كاش)</option><option value="out">سحب (أنا دفعت كاش)</option></select>';
  h+='<label>'+(c==='vf'?'مبلغ العملية':c==='exp'?'المبلغ':'سعر الخدمة')+'</label><input id="a" type="number" inputmode="decimal">';
  if(c==='fix')h+='<label>تكلفة قطع الغيار (إن وجدت)</label><input id="k" type="number" inputmode="decimal" value="0">';
  if(c==='vf')h+='<label>العمولة (ربحك)</label><input id="m" type="number" inputmode="decimal" value="0">';
  h+='<button style="margin-top:14px" onclick="sf(\''+c+'\')">حفظ</button><button class="g" style="margin-top:8px" onclick="cl()">إلغاء</button>';
  op(h);
}
function sf(c){
  var a=parseFloat($('a').value);if(!(a>0)){$('a').focus();return}
  var k=$('k')?parseFloat($('k').value)||0:0,m=$('m')?parseFloat($('m').value)||0:0;
  var p=c==='vf'?m:c==='exp'?-a:a-k;
  D.push({id:Date.now(),d:$('dt').value||today(),c:c,t:$('t').value.trim(),a:a,p:p,v:c==='vf'?$('v').value:''});
  saveD();cl();rh();
}

/* المخزون */
function ri(){
  var t=norm($('is').value).split(/\s+/).filter(Boolean),val=0,r=[];
  P.forEach(function(x){if(x.q>0)val+=x.q*x.c});
  var low=0,out=0;P.forEach(function(x){if(x.q<=0)out++;else if(x.q<=LOW)low++});
  $('is3').innerHTML='<div class="st"><small>الأصناف</small><b>'+f(P.length)+'</b></div><div class="st"><small>قرب يخلص</small><b class="wr">'+low+'</b></div><div class="st"><small>قيمة المخزون (شراء)</small><b>'+f(val)+'</b></div>';
  var all=P.filter(function(x){
    if(flt==='low'&&!(x.q>0&&x.q<=LOW))return false;
    if(flt==='out'&&!(x.q<=0))return false;
    if(flt==='neg'&&!(x.q<0))return false;
    for(var j=0;j<t.length;j++)if(x.k.indexOf(t[j])<0)return false;return true});
  r=all.slice(0,IL);
  $('il').innerHTML=r.map(function(x){return '<div class="it" onclick="itemSheet(\''+x.i+'\')"><div class="l"><b>'+esc(x.n)+'</b><small>'+(x.s==='dish'?'دش':'موبايل')+' · شراء '+f(x.c)+' · بيع '+f(x.p)+'</small></div><div class="r"><b class="'+(x.q<0?'neg':x.q===0?'wr':x.q<=LOW?'wr':'')+'">'+f(x.q)+'</b></div></div>'}).join('')+
    (all.length>IL?'<button class="g" onclick="IL+=60;ri()">عرض المزيد ('+(all.length-IL)+')</button>':'')+(all.length?'':'<p style="color:var(--mu)">لا توجد أصناف.</p>');
}
function itemSheet(id){
  var x=id?M[id]:{n:'',p:'',c:'',q:0,s:'mob'};pendI=null;
  op('<h3>'+(id?'تعديل صنف':'صنف جديد')+'</h3><label>الاسم</label><input id="en" value="'+esc(x.n)+'"><label>سعر البيع</label><input id="ep" type="number" inputmode="decimal" value="'+x.p+'"><label>سعر الشراء</label><input id="ec" type="number" inputmode="decimal" value="'+x.c+'"><label>الكمية</label><input id="eq" type="number" inputmode="decimal" value="'+x.q+'"><label>القسم</label><select id="es"><option value="mob"'+(x.s==='mob'?' selected':'')+'>إكسسوار موبايل</option><option value="dish"'+(x.s==='dish'?' selected':'')+'>إكسسوار دش</option></select><button style="margin-top:14px" onclick="si(\''+(id||'')+'\')">حفظ</button>'+(id?'<button id="dd" class="g" style="margin-top:8px" onclick="di(\''+id+'\')">حذف الصنف</button>':'')+'<button class="g" style="margin-top:8px" onclick="cl()">إلغاء</button>');
}
function si(id){
  var n=$('en').value.trim();if(!n){$('en').focus();return}
  var x=id?M[id]:{i:'n'+Date.now()};
  x.n=n;x.p=parseFloat($('ep').value)||0;x.c=parseFloat($('ec').value)||0;x.q=parseFloat($('eq').value)||0;x.s=$('es').value;
  if(!id)P.unshift(x);idx();saveP();cl();ri();
}
function di(id){
  if(pendI!==id){pendI=id;$('dd').textContent='تأكيد الحذف؟';$('dd').className='d';return}
  P=P.filter(function(x){return x.i!==id});idx();saveP();cl();ri();
}
/* النسخ الاحتياطي */
function bn(){var lb=ld('shop_lastbk'),old=!lb||(Date.now()-new Date(lb).getTime())>6048e5;if(D.length&&old)$('alr').innerHTML+='<div class="al" onclick="bkSheet()">💾 خذ نسخة احتياطية من بياناتك</div>'}
function nat(){return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())}
function dump(){return JSON.stringify({app:'shop',v:1,at:new Date().toISOString(),inv:P.map(function(x){return {i:x.i,n:x.n,p:x.p,c:x.c,q:x.q,s:x.s}}),log:D})}
function msg(t,bad){var m=$('bm');if(m){m.textContent=t;m.className=bad?'neg':'pos'}}
function mark(){sv('shop_lastbk',new Date().toISOString());var l=$('bl');if(l)l.textContent=today()}
function bkSheet(){
  var lb=ld('shop_lastbk');
  op('<h3>💾 النسخ الاحتياطي</h3><small style="color:var(--mu)">آخر نسخة: <span id="bl">'+(lb?lb.slice(0,10):'لم تُحفظ بعد')+'</span></small><div id="bm" style="margin:8px 0;font-size:14px"></div><button onclick="bkSave()">حفظ / مشاركة نسخة احتياطية</button><button class="g" style="margin-top:8px" onclick="bkCopy()">نسخ البيانات كنص</button><label>استرجاع من ملف</label><input type="file" accept=".json,application/json" onchange="bkFile(this)"><label>أو الصق النص هنا</label><textarea id="bt"></textarea><button id="br" class="g" style="margin-top:8px" onclick="bkRestore()">استرجاع</button><button class="g" style="margin-top:8px" onclick="cl()">إغلاق</button>');
}
function bkSave(){
  var s=dump(),name='shop-backup-'+today()+'.json';
  if(nat()){
    var Fs=Capacitor.Plugins.Filesystem,Sh=Capacitor.Plugins.Share;
    Fs.writeFile({path:name,data:s,directory:'CACHE',encoding:'utf8'}).then(function(r){return Sh.share({title:'نسخة احتياطية - حسابات المحل',files:[r.uri]})}).then(function(){mark();msg('تم. ابعت الملف لنفسك على واتساب أو احفظه في Drive')}).catch(function(e){msg('تعذر الحفظ: '+(e&&e.message||e),1)});
    return;
  }
  if(/Electron/i.test(navigator.userAgent)){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();mark();msg('تم حفظ الملف في مجلد التنزيلات (Downloads)');return}
  try{var fl=new File([s],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[fl]})){navigator.share({files:[fl]}).then(function(){mark();msg('تمت المشاركة')}).catch(function(){bkCopy()});return}}catch(e){}
  bkCopy();
}
function bkCopy(){
  var s=dump(),t=$('bt');t.value=s;
  function ok(){mark();msg('تم النسخ. الصقه في واتساب لنفسك أو في ملاحظات')}
  function fb(){t.focus();t.select();try{document.execCommand('copy');ok()}catch(e){msg('انسخ النص اللي في الخانة بإيدك',1)}}
  try{navigator.clipboard.writeText(s).then(ok,fb)}catch(e){fb()}
}
function bkFile(inp){var fl=inp.files&&inp.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){$('bt').value=r.result;msg('تم قراءة الملف. اضغط استرجاع')};r.readAsText(fl)}
var bkP=false;
function bkRestore(){
  var o;try{o=JSON.parse($('bt').value)}catch(e){msg('النص مش نسخة احتياطية صالحة',1);return}
  if(!o||o.app!=='shop'||!Array.isArray(o.inv)||!Array.isArray(o.log)){msg('النص مش نسخة احتياطية صالحة',1);return}
  if(!bkP){bkP=true;$('br').textContent='تأكيد: هيتم استبدال كل البيانات الحالية';$('br').className='d';return}
  bkP=false;
  P=o.inv.map(function(x){return {i:String(x.i),n:String(x.n),p:+x.p||0,c:+x.c||0,q:+x.q||0,s:x.s==='dish'?'dish':'mob'}});
  D=o.log;idx();saveP();saveD();mark();cl();rh();ri();
}
rh();
</script>
</body>
</html>
